<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- lapisan kelopak bunga berjatuhan, dipakai di seluruh halaman -->
<div class="petals-layer" id="petalsLayer" aria-hidden="true"></div>

<!-- ================= 1. LOADING SCREEN ================= -->
<section id="loadingScreen" class="screen loading-screen">
  <div class="loading-bloom">
    <span class="petal p1"></span>
    <span class="petal p2"></span>
    <span class="petal p3"></span>
    <span class="petal p4"></span>
    <span class="petal p5"></span>
  </div>
  <p class="loading-text" id="loadingText"></p>
</section>

<!-- ================= 2. PASSCODE SCREEN ================= -->
<section id="passcodeScreen" class="screen passcode-screen hidden">
  <div class="passcode-card">
    <div class="passcode-flower">🌸</div>
    <h1 class="passcode-title" id="passcodeTitle"></h1>
    <p class="passcode-subtitle" id="passcodeSubtitle"></p>

    <div class="passcode-dots" id="passcodeDots"></div>

    <div class="passcode-keypad" id="passcodeKeypad"></div>

    <p class="passcode-hint" id="passcodeHint"></p>
  </div>
</section>

<!-- ================= 3. GIFT OPENING ================= -->
<section id="giftScreen" class="screen gift-screen hidden">
  <div class="gift-rays" aria-hidden="true"></div>
  <div class="gift-flash" aria-hidden="true"></div>
  <div class="gift-stage" aria-hidden="true">
    <div class="gift-shadow"></div>
    <div class="gift-beam"></div>
    <div class="gift-ring r1"></div>
    <div class="gift-ring r2"></div>
    <div class="gift-box" id="giftBox">
      <div class="gift-body"></div>
      <div class="gift-lid">
        <div class="gift-bow">
          <span class="loop loop-l"></span>
          <span class="loop loop-r"></span>
          <span class="knot"></span>
        </div>
      </div>
    </div>
    <div class="gift-particles" id="giftParticles"></div>
  </div>
  <p class="gift-text" id="giftText"></p>
</section>

<!-- ================= MAIN CONTENT ================= -->
<main id="mainContent" class="main-content hidden">

  <!-- floating background music toggle -->
  <button id="musicToggle" class="music-toggle" aria-label="Putar / jeda musik">
    <span class="music-icon">♪</span>
  </button>
  <audio id="bgMusic" loop preload="none"></audio>

  <!-- ---- 4. BOUQUET SECTION ---- -->
  <section class="section bouquet-section" id="bouquetSection">
    <p class="eyebrow" id="bouquetLabel"></p>
    <h2 class="section-title" id="bouquetTitle"></h2>
    <p class="section-subtitle" id="bouquetSubtitle"></p>

    <div class="bouquet-stage" id="bouquetStage">
      <svg class="bouquet-stems" id="bouquetStems" viewBox="0 0 320 340" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="bouquet-wrap"></div>
      <div class="vase">🏺</div>
    </div>

    <p class="instruction-text" id="bouquetInstruction"></p>
  </section>

  <!-- flower message popup -->
  <div class="flower-popup hidden" id="flowerPopup">
    <div class="flower-popup-card">
      <span class="flower-popup-emoji" id="popupEmoji"></span>
      <p class="flower-popup-message" id="popupMessage"></p>
      <button class="flower-popup-close" id="popupClose">Tutup</button>
    </div>
  </div>

  <!-- ---- 5. LETTER SECTION ---- -->
  <section class="section letter-section reveal" id="letterSection">
    <p class="eyebrow" id="letterLabel"></p>
    <h2 class="section-title" id="letterTitle"></h2>

    <div class="letter-paper">
      <p class="letter-date" id="letterDate"></p>
      <p class="letter-greeting" id="letterGreeting"></p>
      <div class="letter-body" id="letterBody"></div>
      <p class="letter-ps" id="letterPs"></p>
      <p class="letter-signature" id="letterSignature"></p>
    </div>
  </section>

  <!-- ---- 6. MEMORIES / POLAROID GALLERY ---- -->
  <section class="section memories-section" id="memoriesSection">
    <p class="eyebrow" id="memoriesLabel"></p>
    <h2 class="section-title" id="memoriesTitle"></h2>

    <div class="polaroid-stack" id="polaroidStack"></div>
  </section>

  <!-- photo detail popup -->
  <div class="flower-popup hidden" id="photoPopup">
    <div class="flower-popup-card photo-popup-card">
      <img id="photoPopupImg" class="photo-popup-img" src="" alt="">
      <p class="photo-popup-caption" id="photoPopupCaption"></p>
      <p class="photo-popup-date" id="photoPopupDate"></p>
      <button class="flower-popup-close" id="photoPopupClose">Tutup</button>
    </div>
  </div>

  <!-- ---- 7. JOURNEY TIMELINE ---- -->
  <section class="section journey-section" id="journeySection">
    <p class="eyebrow" id="journeyLabel"></p>
    <h2 class="section-title" id="journeyTitle"></h2>

    <div class="timeline" id="timeline"></div>
  </section>

  <!-- ---- 8. GRATITUDE JAR ---- -->
  <section class="section gratitude-section" id="gratitudeSection">
    <p class="eyebrow" id="gratitudeLabel"></p>
    <h2 class="section-title" id="gratitudeTitle"></h2>
    <p class="section-subtitle" id="gratitudeInstruction"></p>

    <div class="jar-wrap">
      <div class="jar" id="jar">
        <span class="jar-note n1"></span>
        <span class="jar-note n2"></span>
        <span class="jar-note n3"></span>
        <span class="jar-note n4"></span>
      </div>
      <button class="jar-button" id="jarButton"></button>
    </div>

    <div class="note-card hidden" id="noteCard">
      <span class="note-index" id="noteIndex"></span>
      <p class="note-text" id="noteText"></p>
    </div>
  </section>

  <!-- ---- 9. FINALE ---- -->
  <section class="section finale-section" id="finaleSection">
    <div class="finale-card">
      <span class="finale-emoji" id="finaleEmoji"></span>
      <h2 class="finale-title" id="finaleTitle"></h2>
      <p class="finale-subtitle" id="finaleSubtitle"></p>
      <button class="finale-close" id="finaleClose"></button>
    </div>
    <p class="finale-footer" id="finaleFooter"></p>
  </section>

</main>

<!-- ================= MODE DEMO: tombol kembali + WhatsApp ================= -->

  <span id="demoBackText"></span>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
